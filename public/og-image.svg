<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0E0F11"/>

  <!-- Subtle inner border -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#2A2C30" stroke-width="1"/>

  <!-- Subtle grid lines -->
  <line x1="40" y1="210" x2="1160" y2="210" stroke="#1C1E21" stroke-width="1"/>
  <line x1="40" y1="420" x2="1160" y2="420" stroke="#1C1E21" stroke-width="1"/>

  <!-- Logo mark: >_ EA -->
  <text x="80" y="120" font-family="'Courier New', Courier, monospace" font-size="22" font-weight="500" fill="#52504D" letter-spacing="2">&#x3E;_</text>
  <text x="122" y="120" font-family="'Courier New', Courier, monospace" font-size="22" font-weight="500" fill="#6EBF9E" letter-spacing="2">EA</text>

  <!-- amaeli.se -->
  <text x="1120" y="120" font-family="'Courier New', Courier, monospace" font-size="18" fill="#6EBF9E" text-anchor="end" letter-spacing="1">amaeli.se</text>

  <!-- Name -->
  <text x="80" y="340" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="88" font-weight="300" fill="#F0EDE8" letter-spacing="6">ELIYA AMANOEEL</text>

  <!-- Role -->
  <text x="80" y="400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#C8C4BF" letter-spacing="1">Senior Developer &amp; Solutions Architect — Stockholm</text>

  <!-- Bottom mono line -->
  <text x="80" y="536" font-family="'Courier New', Courier, monospace" font-size="16" fill="#8C8985" letter-spacing="2">13+ years · .NET · SharePoint · AI-augmented development</text>

  <!-- Bottom right accent dot -->
  <circle cx="1120" cy="530" r="4" fill="#6EBF9E"/>
</svg>
